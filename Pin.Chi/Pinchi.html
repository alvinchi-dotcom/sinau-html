
<!DOCTYPE html>
<html>
<head>
    <title>Form Pendaftaran</title>
</head>
<body>

    <h2>Form Pendaftaran</h2>

    <form>
        Nama Lengkap:<br>
        <input type="text" placeholder="Masukkan nama"><br><br>

        Email:<br>
        <input type="email" placeholder="Masukkan email"><br><br>

        Jenis Kelamin:<br>
        <input type="radio" name="jk" value="Laki-laki"> Laki-laki
        <input type="radio" name="jk" value="Perempuan"> Perempuan
        <br><br>

        Tempat, Tanggal Lahir:<br>
        <input type="text" placeholder="Tempat lahir">
        <input type="date"><br><br>

        Alamat:<br>
        <textarea rows="3" cols="30"></textarea><br><br>

        Nomor HP:<br>
        <input type="number" placeholder="Masukkan nomor HP"><br><br>

        <button type="submit">Daftar</button>
        <button type="reset">Reset</button>
    </form>

</body>
</html>
